<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1424"><title>月下議會｜狼人殺主持工具</title>
<link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<main>
<section id="home" class="screen welcome" hidden>
<div class="home-brand"><h1>月下議會</h1><p>狼人殺主持工具</p></div>
<div class="menu"><button id="start" class="primary">開始主持</button><button id="encyclopediaOpen">角色圖鑑</button></div>
</section>
<section id="counts" class="screen" hidden><h1>選擇人數</h1><p class="page-subtitle">請選擇本場遊戲的人數</p><div id="countChoices" class="menu count-choices"></div><button data-home class="quiet page-back">返回首頁</button></section>
<section id="boards" class="screen" hidden><h1>選擇板子</h1><p id="boardCount" class="page-subtitle"></p><div class="board-window"><div id="boardChoices" class="menu"></div></div><button id="boardBack" class="quiet page-back">上一步</button></section>
<section id="setup" class="screen" hidden>
<h1 id="setupTitle"></h1><div class="setup-grid"><section><h2>狼人陣營</h2><ul id="setupWolves"></ul></section><section><h2>好人陣營</h2><ul id="setupGood"></ul></section></div>
<details class="rules-form"><summary>本局規則</summary>
<label>警長<select id="ruleSheriff"><option value="true">開</option><option value="false">關</option></select></label>
<label>女巫自救<select id="ruleSelfRescue"><option value="false">不允許</option><option value="true">允許</option></select></label>
<label>狼人勝利條件<select id="ruleVictory"><option value="edge">屠邊</option><option value="city">屠城</option></select></label>
<label><span id="swallowLabel"></span><select id="ruleSwallow"><option value="false">不啟用</option><option value="true">啟用</option></select></label>
<label id="idiotRules" hidden>白痴追刀<select id="ruleIdiotChase"><option value="false">關閉（不用追刀）</option><option value="true">開啟（需要追刀）</option></select></label>
<div id="mechanicalRules" hidden><label>學習狼人後<select id="ruleMechanicalKnife"><option value="next">下一晚可刀</option><option value="allDead">狼全死才有雙刀</option></select></label><label>機械守衛反彈毒藥<select id="ruleReflectPoison"><option value="false">關閉</option><option value="true">開啟</option></select></label></div>
</details><details class="night-order"><summary>夜間順序</summary><p id="setupOrder"></p></details><div class="actions"><button id="setupBack">上一步</button><button id="setupStart" class="primary">開始主持</button></div>
</section>
<section id="encyclopedia" class="screen" hidden><h1>角色圖鑑</h1><button id="libraryReturn" class="quiet">返回首頁</button><div class="library-tabs"><button id="libraryWolves">狼人陣營</button><button id="libraryGood">好人陣營</button></div><div id="roleLibrary" class="library"></div></section>
<section id="host" hidden>
<header class="host-top"><span id="phase"></span><span id="boardName"></span><div><button id="rulesOpen" class="quiet">規則</button><button id="hostLibrary" class="quiet">圖鑑</button></div></header>
<section class="host-center"><p id="stepLabel" class="small" hidden></p><div class="script-box"><p class="caption">主持字幕</p><h2 id="subtitle" aria-live="polite"></h2></div><div class="judge-box"><div class="judge-content"><p id="hint"></p><div id="operationCard"></div><div id="gestureResult"></div><p id="selection"></p></div><div id="actions" class="actions"></div></div></section>
<div class="table"><aside id="left" class="seats" aria-label="1至6號座位"></aside><aside id="right" class="seats" aria-label="7至12號座位"></aside></div>
<footer><button id="timerOpen" class="quiet">發言計時器</button><button id="explodeOpen" class="quiet" disabled>狼人自爆</button><button id="reset" class="quiet">重新開局</button></footer>
<p id="saveStatus" class="small" role="status"></p>
<nav aria-label="主持流程"><button id="back">上一步</button><button id="next" class="primary">下一步</button></nav>
</section>
<section id="finished" class="finished-screen" hidden aria-label="遊戲結束">
<header class="victory"><p>遊戲結束</p><h1 id="winnerTitle"></h1><p id="winnerReason"></p></header>
<p id="mixedOutcome" class="mixed-outcome" hidden></p>
<h2 class="recap-title">夜間復盤</h2><div id="nightRecap" class="night-recap"></div>
<div class="finish-actions"><button id="playAgain" class="primary">重新一局</button><button id="finishHome">回首頁</button></div>
</section>
</main>
<dialog id="timerDialog"><div class="dialog-head"><h2>發言計時器</h2><button id="timerClose" aria-label="關閉計時器">×</button></div>
<div class="timer-adjust"><button id="timerMinus">−10秒</button><div class="time-wheels"><div id="minuteWheel" class="time-wheel" role="listbox" aria-label="分鐘" tabindex="0"></div><span>:</span><div id="secondWheel" class="time-wheel" role="listbox" aria-label="秒鐘" tabindex="0"></div></div><button id="timerPlus">＋10秒</button></div>
<div class="actions timer-controls"><button id="timerStart" class="primary">開始</button><button id="timerPause">暫停</button><button id="timerReset">重設</button></div><p id="timerNotice" role="status"></p></dialog>
<dialog id="finishDialog" aria-labelledby="finishDialogTitle"><h2 id="finishDialogTitle"></h2><p id="finishDialogText"></p><div class="actions"><button id="finishCancel">取消</button><button id="finishConfirm" class="primary">確認</button></div></dialog>
<dialog id="resetDialog"><h2>重新開局</h2><p>回首頁將結束本局並清空對局資料。</p><div class="actions"><button id="resetCancel">繼續本局</button><button id="resetConfirm" class="primary">回首頁</button></div></dialog>
<dialog id="drawDialog" class="draw-dialog" aria-labelledby="drawTitle"><h2 id="drawTitle">抽發言順序</h2><p id="drawPhase" role="status"></p><div id="drawSpinner" class="draw-spinner" aria-hidden="true">✦</div><p id="drawResult" class="draw-result"></p><p id="drawOrder" class="small"></p><button id="drawSkip">點一下立即顯示結果</button><button id="drawClose" class="primary">完成</button></dialog>
<dialog id="rulesDialog"><div class="dialog-head"><h2>本局規則</h2><button id="rulesClose" aria-label="關閉規則">×</button></div><p id="gameRules"></p></dialog>
<dialog id="rolePreview" aria-label="角色介紹"><div class="role-preview-content"><button id="previewCard" class="preview-card" aria-label="翻面查看角色介紹"><span class="preview-inner"><span id="previewFront" class="preview-front"></span><span id="previewBack" class="preview-back" aria-hidden="true"></span></span></button><p>點擊卡片翻面查看角色介紹</p></div><p class="preview-returnhint">點擊空白處即可返回角色圖鑑</p></dialog>
<script type="module" src="app.js"></script>
</body></html>
