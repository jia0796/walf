<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="惡靈騎士反傷">
<title>惡靈騎士反傷</title>
<rect x="4" y="4" width="56" height="56" rx="13" fill="#121A2B" stroke="#F27680" stroke-width="3.1"/>
<!-- Barbed cursed ward: deliberately sharper than the guardian's blue shield -->
<path d="M32 14.5 L43.2 21.4 V32.4 C43.2 40.3 38.8 45.6 32 49.4 C25.2 45.6 20.8 40.3 20.8 32.4 V21.4 Z" fill="#303846" stroke="#F27680" stroke-width="2.6" stroke-linejoin="round"/>
<!-- Violent counterstroke radiating from the point of impact -->
<path d="M32 22.3 L27 32.2 H32 L29.1 41.7 L38.3 29.8 H33.2 L36.2 22.3 Z" fill="#F27680" stroke="#F27680" stroke-width="0.6" stroke-linejoin="round"/>
<!-- Returning, curled strike at the right edge -->
<path d="M46 21.5 C52 24.5 53 32 49.6 38.4 C47.7 42.2 44.5 44 40.6 44.4" fill="none" stroke="#F27680" stroke-width="2.9" stroke-linecap="round"/>
<path d="M43.5 39.6 L39.6 44.5 L45.5 47.1" fill="none" stroke="#F27680" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Incoming strike is turned aside; cool gray matches existing neutral metal -->
<path d="M12.6 31.4 H18.2" fill="none" stroke="#AEB7C4" stroke-width="2.8" stroke-linecap="round"/>
<path d="M15.1 28.5 L18.9 31.4 L15.1 34.3" fill="none" stroke="#AEB7C4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
